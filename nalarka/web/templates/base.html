<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nalarka Motion Graphics Studio{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/app.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/topics" class="nav-brand">
      <span class="brand-badge">NALARKA</span>
      <span>Motion Graphics Studio <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: normal;">v8.1</span></span>
    </a>
    <ul class="nav-links">
      <li><a href="/topics" class="nav-link {% if active_page == 'topics' %}active{% endif %}">Studio & Topics</a></li>
      <li><a href="/library" class="nav-link {% if active_page == 'library' %}active{% endif %}">Library</a></li>
      <li><a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">Render History</a></li>
      <li><a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">Settings</a></li>
    </ul>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Video Player Modal -->
  <div id="video-modal" class="modal-overlay" onclick="if(event.target===this) closeModal('video-modal');">
    <div class="modal-content" style="max-width: 900px; text-align: center;">
      <button class="modal-close" onclick="closeModal('video-modal')">&times;</button>
      <h3 id="video-modal-title" style="margin-bottom: 1rem;">Video Preview</h3>
      <div style="background: #000; border-radius: var(--radius-sm); overflow: hidden; max-height: 70vh; display: flex; align-items: center; justify-content: center;">
        <video id="video-modal-player" controls style="max-width: 100%; max-height: 65vh;">
          <source id="video-modal-source" src="" type="video/mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
      <div style="margin-top: 1rem; display: flex; justify-content: flex-end; gap: 0.75rem;">
        <a id="video-modal-download" href="#" class="btn btn-secondary btn-sm" download>Download MP4</a>
        <button class="btn btn-primary btn-sm" onclick="closeModal('video-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Image Preview Modal -->
  <div id="preview-image-modal" class="modal-overlay" onclick="if(event.target===this) closeModal('preview-image-modal');">
    <div class="modal-content" style="max-width: 1000px; text-align: center;">
      <button class="modal-close" onclick="closeModal('preview-image-modal')">&times;</button>
      <h3 id="preview-modal-title" style="margin-bottom: 1rem;">Beat Contact Sheet</h3>
      <div style="overflow-x: auto; max-height: 75vh;">
        <img id="preview-modal-img" src="" alt="Contact sheet preview" style="max-width: 100%; height: auto; border-radius: var(--radius-sm);">
      </div>
      <div style="margin-top: 1rem; text-align: right;">
        <button class="btn btn-primary btn-sm" onclick="closeModal('preview-image-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Verification Details Modal -->
  <div id="verification-modal" class="modal-overlay" onclick="if(event.target===this) closeModal('verification-modal');">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('verification-modal')">&times;</button>
      <h3 style="margin-bottom: 1rem;">7-Point Verification Suite Results</h3>
      <div id="verification-modal-content">
        <p>Loading...</p>
      </div>
      <div style="margin-top: 1rem; text-align: right;">
        <button class="btn btn-primary btn-sm" onclick="closeModal('verification-modal')">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  {% block scripts %}{% endblock %}
</body>
</html>
